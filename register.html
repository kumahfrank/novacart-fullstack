<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | NovaCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <header id="site-header"></header>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm p-4">
            <h2 class="h3 fw-bold mb-3">Create your account</h2>
            <p class="text-muted">Sign up and start enjoying member-only offers.</p>
            <form id="register-form" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="register-name" class="form-label">Name</label>
                  <input id="register-name" type="text" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="register-email" class="form-label">Email</label>
                  <input id="register-email" type="email" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="register-phone" class="form-label">Phone</label>
                  <input id="register-phone" type="tel" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="register-password" class="form-label">Password</label>
                  <input id="register-password" type="password" class="form-control" required />
                </div>
                <div class="col-12">
                  <label for="register-confirm" class="form-label">Confirm Password</label>
                  <input id="register-confirm" type="password" class="form-control" required />
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4" type="submit">Register</button>
            </form>
            <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
          </div>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/search.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
