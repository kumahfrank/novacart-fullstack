<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NovaCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <header id="site-header"></header>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm p-4">
            <h2 class="h3 fw-bold mb-3">Welcome back</h2>
            <p class="text-muted">Sign in to continue shopping.</p>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="login-email" class="form-label">Email</label>
                <input id="login-email" type="email" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="login-password" class="form-label">Password</label>
                <input id="login-password" type="password" class="form-control" required />
              </div>
              <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember-me" />
                  <label class="form-check-label" for="remember-me">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
              </div>
              <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">New here? <a href="register.html">Create account</a></p>
          </div>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/search.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
