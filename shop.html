<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | NovaCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
      <div class="spinner"></div>
    </div>

    <header id="site-header"></header>

    <main class="container py-4">
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Shop</li>
        </ol>
      </nav>

      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="card border-0 shadow-sm p-4">
            <h3 class="h5 fw-bold mb-3">Filters</h3>
            <div class="mb-3">
              <label for="shop-search" class="form-label">Search</label>
              <input id="shop-search" class="form-control" placeholder="Search products" />
            </div>
            <div class="mb-3">
              <label for="category-filter" class="form-label">Category</label>
              <select id="category-filter" class="form-select">
                <option value="All">All</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="price-filter" class="form-label">Max Price: <span id="price-value">$500</span></label>
              <input id="price-filter" type="range" class="form-range" min="50" max="500" step="10" value="500" />
            </div>
            <div class="mb-3">
              <label for="rating-filter" class="form-label">Minimum Rating</label>
              <select id="rating-filter" class="form-select">
                <option value="0">Any</option>
                <option value="4">4 stars & up</option>
                <option value="4.5">4.5 stars & up</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="sort-filter" class="form-label">Sort By</label>
              <select id="sort-filter" class="form-select">
                <option value="featured">Featured</option>
                <option value="price-asc">Price Low → High</option>
                <option value="price-desc">Price High → Low</option>
                <option value="newest">Newest</option>
                <option value="bestselling">Best Selling</option>
              </select>
            </div>
          </div>
        </aside>

        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h2 class="h3 fw-bold mb-1">Shop all products</h2>
              <p class="text-muted mb-0">Showing curated products for your next inspiration.</p>
            </div>
          </div>
          <div class="row g-4" id="shop-grid"></div>
          <nav class="mt-4" aria-label="Products pagination">
            <ul class="pagination justify-content-center" id="pagination"></ul>
          </nav>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <button id="scroll-top" class="btn btn-primary rounded-circle" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>
    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/search.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
