<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | NovaCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="site-header"></header>
    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h4 fw-bold mb-0" id="admin-form-title">Add product</h2>
              <button class="btn btn-outline-secondary btn-sm" id="admin-reset-btn" type="button">Reset</button>
            </div>
            <form id="admin-product-form">
              <input id="admin-product-id" type="hidden" />
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input id="admin-name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <input id="admin-category" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Price</label>
                <input id="admin-price" type="number" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Old Price</label>
                <input id="admin-old-price" type="number" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label">Discount (%)</label>
                <input id="admin-discount" type="number" class="form-control" value="0" />
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="admin-description" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input id="admin-image" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label">Upload image</label>
                <input id="admin-image-file" type="file" class="form-control" accept="image/*" />
              </div>
              <button class="btn btn-primary w-100" type="submit">Save product</button>
            </form>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h4 fw-bold mb-0">Products overview</h2>
              <span class="text-muted">Manage inventory and promotions</span>
            </div>
            <div id="admin-product-list" class="row g-3"></div>
          </div>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
    <script>
      let editingProductId = null;

      function resetAdminForm() {
        editingProductId = null;
        document.getElementById('admin-form-title').textContent = 'Add product';
        document.getElementById('admin-product-form').reset();
        document.getElementById('admin-product-id').value = '';
      }

      async function loadAdminProducts() {
        const list = document.getElementById('admin-product-list');
        if (!list) return;
        const response = await fetch('/api/products');
        const data = await response.json();
        list.innerHTML = data.products.map(product => `
          <div class="col-md-6">
            <div class="border rounded-4 p-3 h-100">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h3 class="h6 fw-bold mb-0">${product.name}</h3>
                <span class="badge bg-light text-dark">${product.category}</span>
              </div>
              <p class="mb-2 fw-semibold">$${product.price}</p>
              <p class="small text-muted">${product.description}</p>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-primary btn-sm" type="button" data-edit-id="${product.id}">Edit</button>
                <button class="btn btn-outline-danger btn-sm" type="button" data-delete-id="${product.id}">Delete</button>
              </div>
            </div>
          </div>
        `).join('');

        list.querySelectorAll('[data-edit-id]').forEach(button => {
          button.addEventListener('click', () => populateForm(Number(button.getAttribute('data-edit-id'))));
        });
        list.querySelectorAll('[data-delete-id]').forEach(button => {
          button.addEventListener('click', () => deleteProduct(Number(button.getAttribute('data-delete-id'))));
        });
      }

      async function populateForm(productId) {
        const response = await fetch(`/api/products/${productId}`);
        const data = await response.json();
        const product = data.product;
        editingProductId = product.id;
        document.getElementById('admin-form-title').textContent = 'Edit product';
        document.getElementById('admin-product-id').value = product.id;
        document.getElementById('admin-name').value = product.name;
        document.getElementById('admin-category').value = product.category;
        document.getElementById('admin-price').value = product.price;
        document.getElementById('admin-old-price').value = product.oldPrice;
        document.getElementById('admin-discount').value = product.discount;
        document.getElementById('admin-description').value = product.description;
        document.getElementById('admin-image').value = product.image;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function deleteProduct(productId) {
        if (!confirm('Delete this product?')) return;
        const response = await fetch(`/api/admin/products/${productId}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${localStorage.getItem('novacart.adminToken') || ''}` }
        });
        if (response.ok) {
          loadAdminProducts();
          alert('Product deleted');
        }
      }

      async function uploadImage(file) {
        if (!file) return '';
        const reader = new FileReader();
        return await new Promise((resolve) => {
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadAdminProducts();
        document.getElementById('admin-reset-btn').addEventListener('click', resetAdminForm);

        const form = document.getElementById('admin-product-form');
        const imageFileInput = document.getElementById('admin-image-file');
        form?.addEventListener('submit', async (event) => {
          event.preventDefault();
          const imageData = await uploadImage(imageFileInput.files[0]);
          const payload = {
            name: document.getElementById('admin-name').value,
            category: document.getElementById('admin-category').value,
            price: Number(document.getElementById('admin-price').value),
            oldPrice: Number(document.getElementById('admin-old-price').value || document.getElementById('admin-price').value),
            discount: Number(document.getElementById('admin-discount').value || 0),
            rating: 4.5,
            reviews: 0,
            stock: 'In Stock',
            description: document.getElementById('admin-description').value,
            image: imageData || document.getElementById('admin-image').value || 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80',
            featured: true,
            newest: true,
            bestSeller: false
          };

          const endpoint = editingProductId ? `/api/admin/products/${editingProductId}` : '/api/admin/products';
          const method = editingProductId ? 'PUT' : 'POST';
          const response = await fetch(endpoint, {
            method,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('novacart.adminToken') || ''}`
            },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (response.ok) {
            resetAdminForm();
            loadAdminProducts();
            alert(editingProductId ? 'Product updated successfully' : 'Product added successfully');
          } else {
            alert(result.error || 'Unable to save product');
          }
        });
      });
    </script>
  </body>
</html>
