<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | NovaCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm p-4">
            <h2 class="h4 fw-bold mb-3">Admin login</h2>
            <form id="admin-login-form">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="admin-email" type="email" class="form-control" value="admin@novacart.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="admin-password" type="password" class="form-control" value="admin1234" required />
              </div>
              <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script>
      document.getElementById('admin-login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          email: document.getElementById('admin-email').value,
          password: document.getElementById('admin-password').value
        };
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (response.ok) {
          localStorage.setItem('novacart.adminToken', result.token);
          window.location.href = '/admin-dashboard.html';
        } else {
          alert(result.error || 'Login failed');
        }
      });
    </script>
  </body>
</html>
